<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexus AI Studio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- VISTA DE IA (PRINCIPAL) -->
  <div id="ai-view">
    <header class="app-header">
      <div class="header-title">
        <i class="fa-solid fa-brain" style="color:#818cf8;"></i>
        <div>
          <h1>Nexus AI Studio</h1>
          <span class="status-indicator">● Gemini 1.5 Flash Active</span>
        </div>
      </div>
      <button id="btn-settings" class="icon-btn"><i class="fa-solid fa-sliders"></i></button>
    </header>

    <div class="model-selector">
      <button class="model-chip active"><i class="fa-solid fa-bolt"></i> Gemini 1.5 Flash</button>
    </div>

    <div id="ai-messages" class="messages-box">
      <div class="msg-group bot">
        <div class="msg-avatar"><i class="fa-solid fa-robot" style="color:#818cf8;"></i></div>
        <div class="msg-bubble">
          ¡Hola! Soy Nexus AI impulsado por Gemini. ¿En qué te puedo ayudar hoy?
          <span class="msg-time">Ahora</span>
        </div>
      </div>
    </div>

    <div class="input-zone">
      <input type="text" id="ai-input" placeholder="Pregunta algo a Nexus AI...">
      <button id="ai-send" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- PANTALLA DE LOGIN SECRETO -->
  <div id="login-screen" class="hidden">
    <div class="login-card">
      <h2>Acceso Privado</h2>
      <p>Introduce tus credenciales</p>
      <input type="text" id="login-user" placeholder="Usuario">
      <input type="password" id="login-pass" placeholder="Contraseña">
      <button id="btn-login-submit" class="action-btn">Entrar</button>
      <button id="btn-back-ai" class="secondary-btn">Volver a la IA</button>
    </div>
  </div>

  <!-- VISTA DE CHAT SECRETO -->
  <div id="secret-chat-screen" class="hidden">
    <header class="app-header">
      <div class="header-title">
        <img id="my-avatar-img" src="" alt="Avatar" class="msg-avatar" style="cursor:pointer;" title="Cambiar foto">
        <div>
          <h1 id="user-display-name">Chat Privado</h1>
          <span class="status-indicator" style="color:#10b981;">● En línea</span>
        </div>
      </div>
      <button id="btn-lock" class="icon-btn"><i class="fa-solid fa-lock"></i></button>
    </header>

    <div id="secret-messages" class="messages-box"></div>

    <div class="input-zone">
      <input type="text" id="secret-input" placeholder="Escribe un mensaje secreto...">
      <button id="secret-send" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- MODAL DE AJUSTES (INICIA OCULTO CORRECTAMENTE) -->
  <div id="modal-settings" class="hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Ajustes del Sistema</h3>
        <button id="btn-close-modal" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="setting-item">
        <span>Tema oscuro</span>
        <input type="checkbox" checked disabled>
      </div>
      <div class="setting-item">
        <span>Versión</span>
        <span style="opacity:0.7;">2.5.0 (Gemini PRO)</span>
      </div>
      <button id="btn-dev-options" class="secondary-btn" style="width:100%; margin-top:10px;">
        <i class="fa-solid fa-code"></i> Opciones Desarrollador
      </button>
      
      <div id="dev-input-zone" class="hidden" style="margin-top: 15px;">
        <!-- Placeholder limpio sin exponer el PIN en la interfaz -->
        <input type="password" id="dev-code" placeholder="Ingresa el PIN...">
        <button id="btn-verify-code" class="action-btn" style="margin-top: 8px; width: 100%;">Verificar Acceso</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
